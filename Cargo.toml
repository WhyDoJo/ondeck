[package]
name = "ondeck"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, minimal whiteboard"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
glam = "0.30"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
